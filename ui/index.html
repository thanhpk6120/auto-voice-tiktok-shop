<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chat Dashboard Simulator</title>
</head>
<body>
    <h1>TikTok Shop LIVE Simulator</h1>
    <div id="chat-log" style="border:1px solid #ccc; height:200px; overflow-y:auto; margin-bottom:10px; padding: 5px;"></div>
    
    <button onclick="sendEvent('join')">Join</button>
    <button onclick="sendEvent('chat')">Chat Hỏi SP</button>
    <button onclick="sendEvent('gift')">Gift</button>
    <button onclick="sendEvent('order')">Order</button>

    <script>
        // Gui event that ve event bridge (role=source) -> app.py run/doc nhan duoc.
        const BRIDGE_WS = "ws://127.0.0.1:8765/ws?role=source";
        let ws = null;

        function log(msg, cls) {
            const div = document.getElementById('chat-log');
            div.innerHTML += `<div${cls ? ` style="color:${cls}"` : ''}>${new Date().toLocaleTimeString()} - ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
        }

        function connect() {
            ws = new WebSocket(BRIDGE_WS);
            ws.onopen = () => log(`da ket noi bridge ${BRIDGE_WS}`, "green");
            ws.onclose = () => { log("mat ket noi, thu lai sau 2s", "orange"); setTimeout(connect, 2000); };
            ws.onerror = () => { try { ws.close(); } catch (e) {} };
        }

        function sendEvent(type) {
            const data = { type: type, user: "test_user_" + Math.floor(Math.random() * 100), ts: Date.now() / 1000 };
            if (type === 'chat') data.text = "Sản phẩm này giá bao nhiêu?";
            if (type === 'gift') { data.gift = "Hoa hồng"; data.count = 1; }
            if (type === 'order') { data.product = "Áo thun nam Cotton Compact"; data.amount = 150000; }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log(`chua ket noi bridge, bo qua: ${JSON.stringify(data)}`, "red");
                return;
            }
            ws.send(JSON.stringify(data));
            log(`Sent: ${JSON.stringify(data)}`);
        }

        connect();
    </script>
</body>
</html>
